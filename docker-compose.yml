# docker-compose.yml - Root directory
version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: mypadifood_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: mypadifood_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mypadifood_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 5000
      DATABASE_URL: postgresql://postgres:postgres123@postgres:5432/mypadifood_dev
      DIRECT_URL: postgresql://postgres:postgres123@postgres:5432/mypadifood_dev
      JWT_SECRET: dev-secret-change-in-production-min-32-chars
      CORS_ORIGIN: http://localhost:3000
      WHATSAPP_NUMBER: 2348110252143
      BUSINESS_NAME: MyPadiFood Dev
      BUSINESS_TYPE: food
      DEFAULT_CURRENCY: NGN
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:-}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:-}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:-}
    ports:
      - "5000:5000"
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./backend/prisma:/app/prisma
    command: sh -c "pnpm run prisma:push && pnpm run dev"

  # Frontend (Next.js)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mypadifood_frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NEXT_PUBLIC_BACKEND_URL: http://localhost:5000
      NEXT_PUBLIC_WHATSAPP_NUMBER: 2348110252143
      NEXT_PUBLIC_BUSINESS_NAME: MyPadiFood Dev
      NEXT_PUBLIC_BUSINESS_TYPE: food
      NEXT_PUBLIC_CURRENCY: NGN
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    command: pnpm run dev

volumes:
  postgres_data:
    driver: local

networks:
  default:
    name: mypadifood_network